# 只include在vtt.example.com对应的HTTPS server {}内。
# Only include inside the intended vtt.example.com HTTPS server block.
# 不改原Data/modules文件；候选副本必须事先完整就位并核对摘要。
# Do not overwrite shared Data/modules scripts; stage both complete assets first.
location = /modules/babele/script/babele.js {
    if ($host != vtt.example.com) { return 421; }
    alias /var/www/fvtt-load-boost/babele-2.7.5/script/babele.js;
    default_type application/javascript;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control "no-store" always;
    add_header X-FVTT-Babele-Policy "singleflight-2.7.5" always;
    limit_except GET { deny all; }
}
location = /modules/babele/script/wrapper.js {
    if ($host != vtt.example.com) { return 421; }
    alias /var/www/fvtt-load-boost/babele-2.7.5/script/wrapper.js;
    default_type application/javascript;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control "no-store" always;
    add_header X-FVTT-Babele-Policy "singleflight-2.7.5" always;
    limit_except GET { deny all; }
}
