# 单机直连拓扑：浏览器 --HTTPS--> Nginx --HTTP--> Foundry。
# example.com 是保留示例域名；部署前统一替换 vtt.example.com。
# 此文件由 nginx.conf 在 http {} 内 include，不能把下列 map/upstream
# 粘贴到 server {} 或 location {} 内。

# 仅 WebSocket 升级请求转发 Connection: upgrade。
# 普通请求的空值会移除此上游请求头，允许连接复用。
map $http_upgrade $fvtt_connection_upgrade {
    default upgrade;
    ''      '';
}

# 兼容性规则：部分 Foundry 版本的压缩分段响应可能发生长度不一致。
# 对核心 JS/CSS 不转发 Range / If-Range，获取完整响应。
# URI 不包含查询字符串；模组脚本及其他路径不属于此核心文件匹配。
map $uri $fvtt_forward_range {
    default $http_range;
    ~^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ "";
}

map $uri $fvtt_forward_if_range {
    default $http_if_range;
    ~^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ "";
}

# 其他文件若仍携带 Range，向 Foundry 请求未压缩表示。
# 无 Range 时保留浏览器支持的编码，由上游决定是否压缩。
# 这是通用 HTTP 兼容处理，不依赖 CDN；不是下载加速的普遍保证。
map $fvtt_forward_range $fvtt_upstream_accept_encoding {
    ""      $http_accept_encoding;
    default identity;
}

upstream fvtt_backend {
    # 与 Foundry options.json 的 port 对应；仅连接本机示例端口。
    server 127.0.0.1:30000;
    # 每个 worker 的空闲上游连接缓存，不是总连接数上限。
    keepalive 16;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name vtt.example.com;

    # 规范化到固定域名，不把任意客户端 Host 拼接进跳转目标。
    return 301 https://vtt.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vtt.example.com;

    # 只有路径示例，不附带证书或私钥。
    # 请先通过自己的证书签发流程取得覆盖该域名的有效证书。
    ssl_certificate /etc/letsencrypt/live/vtt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 普通 HTTP 上游使用 1.1，并保留 WebSocket 升级能力。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $fvtt_connection_upgrade;
    proxy_set_header Range $fvtt_forward_range;
    proxy_set_header If-Range $fvtt_forward_if_range;
    proxy_set_header Accept-Encoding $fvtt_upstream_accept_encoding;

    # 核心代码始终返回完整表示，不允许 Nginx 再生成局部响应。
    # 不覆盖 Foundry 的 Cache-Control，不强制 public/s-maxage。
    location ~ ^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ {
        proxy_pass http://fvtt_backend;
        proxy_hide_header Accept-Ranges;
        max_ranges 0;
    }

    # WebSocket 与长连接不经过常规响应缓冲。
    # read/send timeout 是相邻读写操作的超时，不是固定会话寿命。
    location ^~ /socket.io/ {
        proxy_pass http://fvtt_backend;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 页面、登录、API、素材、模组等按 Foundry 原生语义转发。
    # 未配置 proxy_cache，也不按扩展名给素材统一加七天 public 缓存。
    location / {
        proxy_pass http://fvtt_backend;
        proxy_buffering on;
    }
}
