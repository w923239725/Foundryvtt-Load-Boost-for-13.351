# Ubuntu 22.04 / Nginx 1.18 风格的全局配置示例。
# 不是现有服务器配置的逐字副本，也不是必须替换的优化项。
# 已有站点时保留原全局文件，按下述说明合并缺失项，不重复声明同层指令。
# 只复制sites-available不会带入本文件的gzip设置；须检查实际http/server/location继承。
# MIT; Foundryvtt Load Boost for 13.351 contributors. See ../../LICENSE.md.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    # 示例值，不代表经过容量测试；连接数同时包含客户端和上游连接。
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # 允许上传的最大请求体；请按实际素材大小和资源限制调整。
    client_max_body_size 100m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 常规完整响应启用gzip；不是保证每个响应都会被压缩。
    # 还取决于客户端Accept-Encoding、响应类型/状态/长度及是否已被上游编码。
    # 已有Content-Encoding的上游响应不会由此再压缩一层。
    gzip on;
    # 向缓存表明表示可能随Accept-Encoding变化，避免编码版本混用。
    gzip_vary on;
    # 显式保留默认等级1（1-9），优先低CPU成本；提高等级不是必然更快。
    gzip_comp_level 1;
    # 1024字节以下不主动压缩；长度判断依据响应Content-Length。
    gzip_min_length 1024;
    # text/html原生包含，无需重复；不对JPEG/WebP/ZIP/WOFF2等已压缩格式强制gzip。
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/wasm image/svg+xml;
    # 保守保留默认off：带Via的边缘回源请求不由本Nginx动态gzip。
    # 这不阻止Foundry已经压缩的响应，也不关闭边缘节点自己的压缩。
    # 若证实公开静态文件因Via漏压缩，可评估仅在其精确location内配置gzip_proxied any。
    # 不在全局开启any，不扩大到认证页面/API/私人响应；该候选尚未验证。
    gzip_proxied off;
    # 核心完整响应及其他Range请求的编码兼容规则见sites-available，不要删除。
    # gzip on不会配置WebSocket消息压缩，也不能减少客户端规则初始化/翻译计算。

    # 两个 include 保留 Ubuntu 常见布局。
    # 同一站点只能通过一个入口加载，避免把同一文件同时放入两处。
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
