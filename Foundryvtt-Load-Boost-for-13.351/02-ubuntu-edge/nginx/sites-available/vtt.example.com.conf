# 子项目02：边缘HTTPS服务 -> Nginx HTTPS源站 -> 本机Foundry。
# 替换保留示例域名/证书路径；不要与子项目01同时启用。
# maps/upstream 必须位于http上下文。
map $http_upgrade $fvtt_connection_upgrade {
    default upgrade;
    ''      '';
}

# 不允许缓存私有响应；仅显式满足条件的公共核心资源使用共享缓存。
map $upstream_http_cache_control $fvtt_origin_forbids_cache {
    default 0;
    ~*(private|no-store) 1;
}

map "$request_method|$upstream_status|$upstream_http_set_cookie|$http_authorization|$fvtt_origin_forbids_cache" $fvtt_core_cache_control {
    default "no-store";
    "GET|200|||0" "public, max-age=0, s-maxage=300, must-revalidate";
    "GET|304|||0" "public, max-age=0, s-maxage=300, must-revalidate";
}

# 核心代码禁用局部表示，其他分段请求让源程序返回identity正文。
map $uri $fvtt_forward_range {
    default $http_range;
    ~^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ "";
}
map $uri $fvtt_forward_if_range {
    default $http_if_range;
    ~^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ "";
}
map $fvtt_forward_range $fvtt_upstream_accept_encoding {
    "" $http_accept_encoding;
    default identity;
}
upstream fvtt_backend {
    server 127.0.0.1:30000;
    keepalive 16;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}
server {
    listen 80;
    listen [::]:80;
    server_name vtt.example.com;
    return 301 https://vtt.example.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vtt.example.com;
    ssl_certificate /etc/letsencrypt/live/vtt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 默认不信任外部XFF。此时日志看到的可能是边缘节点地址。
    # 真IP恢复必须另行限定受信代理地址及阻止源站绕过，不能信任所有网段。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $fvtt_connection_upgrade;
    proxy_set_header Range $fvtt_forward_range;
    proxy_set_header If-Range $fvtt_forward_if_range;
    proxy_set_header Accept-Encoding $fvtt_upstream_accept_encoding;

    # 仅核心JS/CSS强制此缓存策略，不把API或模组文件纳入。
    location ~ ^/(?:scripts/.*\.(?:js|mjs)|css/.*\.css)$ {
        proxy_pass http://fvtt_backend;
        proxy_hide_header Cache-Control;
        proxy_hide_header Accept-Ranges;
        max_ranges 0;
        add_header Cache-Control $fvtt_core_cache_control always;
    }
    location ^~ /socket.io/ {
        proxy_pass http://fvtt_backend;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://fvtt_backend;
        proxy_buffering on;
    }
}
