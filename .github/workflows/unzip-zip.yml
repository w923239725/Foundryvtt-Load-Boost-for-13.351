name: Unpack uploaded ZIP (one-time)

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find zip file
        id: findzip
        shell: bash
        run: |
          set -e
          zipfile=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '\.zip$' || true)
          if [ -z "$zipfile" ]; then
            zipfile=$(git ls-files '*.zip' | head -n 1 || true)
          fi
          if [ -z "$zipfile" ]; then
            echo "No zip file found"
            exit 0
          fi
          echo "ZIP_FILE=$zipfile" >> "$GITHUB_ENV"

      - name: Unzip to repo root
        if: env.ZIP_FILE != ''
        shell: bash
        run: |
          unzip -o "$ZIP_FILE" -d .

      - name: Flatten single top-level directory (if present)
        if: env.ZIP_FILE != ''
        shell: bash
        run: |
          set -e
          # collect top-level entries excluding .git and .github
          mapfile -t entries < <(find . -maxdepth 1 -mindepth 1 -printf '%P\n' | sed '/^\.git$/d' | sed '/^\.github$/d' || true)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            dir="${entries[0]}"
            echo "Found single top-level directory: $dir — flattening"
            shopt -s dotglob
            conflicts="conflicts_${GITHUB_RUN_ID}"
            mkdir -p "$conflicts"
            # Move each item in the inner dir to repo root; if name exists, move it to conflicts dir
            for item in "$dir"/* "$dir"/.[!.]* "$dir"/..?*; do
              [ -e "$item" ] || continue
              name="$(basename "$item")"
              if [ -e "$name" ]; then
                echo "Conflict for $name — moving to $conflicts/"
                mv "$item" "$conflicts/"
              else
                mv "$item" .
              fi
            done
            shopt -u dotglob
            # try to remove the now-empty directory
            rmdir "$dir" || true
          else
            echo "No single top-level directory to flatten."
          fi

      - name: Delete zip file
        if: env.ZIP_FILE != ''
        shell: bash
        run: |
          if git ls-files --error-unmatch "$ZIP_FILE" >/dev/null 2>&1; then
            git rm -f "$ZIP_FILE"
          else
            rm -f "$ZIP_FILE"
          fi

      - name: Delete workflow so it only runs once
        if: env.ZIP_FILE != ''
        shell: bash
        run: |
          rm -f .github/workflows/unpack-zip.yml || true

      - name: Commit and push
        if: env.ZIP_FILE != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack uploaded zip, flatten single-folder layout, remove workflow (one-time)"
          branch="${GITHUB_REF#refs/heads/}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
